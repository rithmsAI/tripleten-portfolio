services:
  access-lab:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /state:size=16m,uid=10001,gid=10001,mode=0700
    secrets: [lab_tokens]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
secrets:
  lab_tokens:
    file: ./tokens.local.json
