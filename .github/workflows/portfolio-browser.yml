name: Portfolio browser checks
on:
  push:
    paths: ['projects/incidents/**', 'projects/tracebench/**', 'assets/**', 'tests/**', '.github/workflows/portfolio-browser.yml']
  pull_request:
    paths: ['projects/incidents/**', 'projects/tracebench/**', 'assets/**', 'tests/**', '.github/workflows/portfolio-browser.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
