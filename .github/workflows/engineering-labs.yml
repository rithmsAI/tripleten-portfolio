name: Engineering labs
on:
  push:
    paths: ['projects/authlog-cpp/**', 'projects/torch-telemetry/**', 'projects/access-control-lab/**', '.github/workflows/engineering-labs.yml']
  pull_request:
    paths: ['projects/authlog-cpp/**', 'projects/torch-telemetry/**', 'projects/access-control-lab/**', '.github/workflows/engineering-labs.yml']
permissions:
  contents: read
jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C projects/authlog-cpp test sanitize
  pytorch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/torch-telemetry/requirements.txt
      - run: cd projects/torch-telemetry && python -m unittest -v && python experiment.py --output /tmp/telemetry-results
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t access-lab projects/access-control-lab
      - run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 256m --tmpfs /tmp:rw,size=16m,mode=1777 access-lab python -m unittest -v
