name: RithmScope research checks
on:
  push:
    paths: ['projects/market-forecast-lab/**', '.github/workflows/market-forecast.yml']
  pull_request:
    paths: ['projects/market-forecast-lab/**', '.github/workflows/market-forecast.yml']
permissions:
  contents: read
jobs:
  research:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: projects/market-forecast-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/market-forecast-lab/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python demo.py --output output/ci-demo
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-engineering-demo-not-market-evidence-${{ matrix.os }}
          path: projects/market-forecast-lab/output/ci-demo/
